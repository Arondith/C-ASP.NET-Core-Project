services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: "LOCAL-DOCKER-DEVELOPMENT-KEY-CHANGE-BEFORE-DEPLOYMENT-123456"
      ConnectionStrings__DefaultConnection: "Data Source=/data/taskforge.db"
    volumes:
      - taskforge-data:/data

volumes:
  taskforge-data:
